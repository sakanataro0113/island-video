title: 第3話 さけ川の鮭
title_en: "Episode 3: The Salmon River"
year: 6
population: 41
season: 秋
scenes:
  - {"place": "大浜", "time": "夕方", "cast": [], "camera": {"from": [-0.4, 9, 14], "to": [-0.3, 10, 6], "look": [-0.5, 0, -14]}, "narration": "この秋、さけ川を上った鮭は、\n[1匹もいなかった]。", "seconds": 3.4, "en": {"narration": "This autumn, not one salmon\nmade it [up the river]."}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [-6, 24, 38], "to": [-3, 17, 28], "look": [0, 0, -6]}, "narration": "島に来て6年目。\n住民は41人。", "seconds": 2.8, "en": {"narration": "Year 6 on the island.\n41 people."}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [0.6, 1.1, 3.0], "to": [0.3, 1.0, 2.4], "look": [-0.3, 0.0, -0.6], "fov": 55}, "narration": "毎年秋、海から鮭が上ってくる。\nだから、[さけ川]と呼ばれた。", "seconds": 3.4, "props": [{"asset": "salmon", "scale": 1.5, "face_path": true, "path": [{"t": 0.0, "at": [-0.6, 0.0, 2.2]}, {"t": 3.0, "at": [-0.6, 0.0, -2.0]}]}, {"asset": "salmon", "scale": 1.5, "face_path": true, "path": [{"t": 0.4, "at": [0.1, 0.0, 2.8]}, {"t": 3.4, "at": [0.1, 0.0, -1.4]}]}, {"asset": "salmon", "scale": 1.5, "face_path": true, "path": [{"t": 0.8, "at": [-1.0, 0.0, 3.0]}, {"t": 3.4, "at": [-1.0, 0.0, -0.8]}]}], "en": {"narration": "Every autumn, salmon swam up from the sea.\nThat's why they called it [Salmon River]."}}
  - {"place": "大浜", "time": "昼", "cast": ["ハナ", "ゲンタ"], "camera": {"from": [-0.25, 3.2, 7.0], "to": [-0.25, 3.0, 6.4], "look": [-0.25, 0.8, -0.2], "fov": 82}, "narration": "5年目までは、両村がそれぞれの岸から\n手で少しずつ捕っていた。", "seconds": 3.6, "positions": {"ハナ": [-2.6, 0.0], "ゲンタ": [2.3, 0.2]}, "faces": {"ハナ": 90, "ゲンタ": -90}, "props": [{"asset": "salmon", "scale": 1.3, "face_path": true, "path": [{"t": 0.0, "at": [-0.5, 0.0, 2.0]}, {"t": 3.0, "at": [-0.5, 0.0, -1.5]}]}], "en": {"narration": "Until year five, each village\ntook a few by hand, from its own bank."}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [-5.5, 9, 15], "to": [-5.5, 8.5, 14], "look": [-5.5, 0, 4]}, "narration": "もり村の側の海は砂地で、魚が少ない。\n海の漁では、はま村にかなわなかった。", "seconds": 3.6, "labels": [{"text": "もり村の海", "x": 0.5, "y": 0.4}], "en": {"narration": "Forest Village's sea was sandy, with few fish.\nAt sea, they couldn't match Shore Village.", "labels": [{"text": "Forest Village's sea"}]}}
  - {"place": "大浜", "time": "朝", "cast": ["ハナ"], "camera": {"from": [-1.4, 1.5, 1.5], "to": [-1.5, 1.45, 1.2], "look": [-2.6, 1.2, 0.0], "fov": 60}, "narration": "6年目の秋。もり村のハナが、\n跳ねる鮭を見て思いついた。", "seconds": 3.2, "positions": {"ハナ": [-2.6, 0.0]}, "faces": {"ハナ": 60}, "props": [{"asset": "salmon", "scale": 1.3, "face_path": true, "path": [{"t": 0.0, "at": [-1.2, 0.0, 1.8]}, {"t": 3.0, "at": [-1.2, 0.0, -0.8]}]}], "labels": [{"text": "ハナ", "sub": "もり村の漁師", "x": 0.5, "y": 0.52}], "en": {"narration": "Autumn, year six. Hana, of Forest Village,\nwatched the salmon leap — and had an idea.", "labels": [{"text": "Hana", "sub": "Forest Village fisher"}]}}
  - {"place": "大浜", "time": "朝", "cast": ["ハナ"], "camera": {"from": [-1.4, 1.55, 1.4], "to": [-1.5, 1.5, 1.2], "look": [-2.6, 1.3, 0.0], "fov": 55}, "narration": "「川をせき止めて、\n囲いに追い込めばいい」", "seconds": 2.8, "speaker": "ハナ", "positions": {"ハナ": [-2.6, 0.0]}, "faces": {"ハナ": 60}, "actions": [{"do": "ハナが指さす", "from": 0.3, "to": 2.4}], "en": {"narration": "\"Block the river.\nDrive them into a pen.\""}}
  - {"place": "大浜", "time": "昼", "cast": ["タケゾウ"], "camera": {"from": [-0.6, 2.6, 4.2], "to": [-0.8, 2.4, 3.6], "look": [-2.4, 0.6, -0.4], "fov": 60}, "narration": "木を切り、組むのは、\n[木こりの得意な仕事]だった。", "seconds": 3.2, "positions": {"タケゾウ": [-2.9, -0.9]}, "faces": {"タケゾウ": 60}, "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}], "crowd": {"lines": [{"from": [-3.4, -1.2], "to": [-7.5, -2.2], "count": 8, "face": 90, "palette": "mori"}], "seed": 4}, "en": {"narration": "Cutting and building with wood\nwas [what woodcutters did best]."}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [-0.25, 7.5, 7.5], "to": [-0.25, 7.2, 7.0], "look": [-0.25, 0, 0.0], "fov": 62}, "narration": "やなは、河口の[西半分]だけ。\n東半分ははま村の側で、入れば掟破りだ。", "seconds": 3.6, "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}], "labels": [{"text": "もり村の側", "x": 0.28, "y": 0.3}, {"text": "はま村の側", "x": 0.72, "y": 0.3}], "en": {"narration": "The weir covered only [the west half].\nThe east half was Shore Village's.", "labels": [{"text": "Forest side"}, {"text": "Shore side"}]}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [-0.3, 1.6, 1.6], "to": [-0.4, 1.5, 1.3], "look": [-1.3, 0.2, -0.3], "fov": 55}, "narration": "鮭は次々に囲いに入り、\nかごはいっぱいになった。", "seconds": 3.2, "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}, {"asset": "salmon", "at": [-1.35, 0.05, -0.05], "yaw": 0.3, "scale": 1.5}, {"asset": "salmon", "at": [-1.0, 0.05, -0.15], "yaw": 2.6, "scale": 1.5}, {"asset": "salmon", "at": [-1.2, 0.12, -0.25], "yaw": 1.2, "scale": 1.5}, {"asset": "basket", "state": "満", "at": [-3.4, 0.0, -0.6], "scale": 1}, {"asset": "basket", "state": "満", "at": [-3.9, 0.0, -0.2], "scale": 1}, {"asset": "salmon", "scale": 1.4, "face_path": true, "path": [{"t": 0.0, "at": [-0.9, 0.0, 1.8]}, {"t": 3.0, "at": [-0.9, 0.0, -0.2]}]}], "en": {"narration": "Salmon poured into the pen.\nThe baskets filled up."}}
  - {"place": "大浜", "time": "昼", "cast": ["ゲンタ"], "camera": {"from": [1.0, 1.5, 1.7], "to": [1.1, 1.45, 1.4], "look": [2.3, 1.2, 0.2], "fov": 60}, "narration": "東の岸で釣っていたのは、\nはま村のゲンタ。", "seconds": 3.0, "positions": {"ゲンタ": [2.3, 0.2]}, "faces": {"ゲンタ": -50}, "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}], "labels": [{"text": "ゲンタ", "sub": "はま村の漁師", "x": 0.5, "y": 0.52}], "en": {"narration": "On the east bank, fishing,\nwas Genta of Shore Village.", "labels": [{"text": "Genta", "sub": "Shore Village fisher"}]}}
  - {"place": "大浜", "time": "昼", "cast": ["ゲンタ"], "camera": {"from": [1.0, 1.5, 1.7], "to": [1.1, 1.45, 1.5], "look": [2.3, 1.2, 0.2], "fov": 60}, "narration": "「あいつら、\n[あんなに]捕ってやがる」", "seconds": 2.8, "speaker": "ゲンタ", "positions": {"ゲンタ": [2.3, 0.2]}, "faces": {"ゲンタ": -50}, "actions": [{"do": "ゲンタが指さす", "from": 0.2, "to": 2.4}], "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}, {"asset": "salmon", "at": [-1.35, 0.05, -0.05], "yaw": 0.3, "scale": 1.5}, {"asset": "salmon", "at": [-1.0, 0.05, -0.15], "yaw": 2.6, "scale": 1.5}, {"asset": "salmon", "at": [-1.2, 0.12, -0.25], "yaw": 1.2, "scale": 1.5}, {"asset": "basket", "state": "満", "at": [-3.4, 0.0, -0.6], "scale": 1}, {"asset": "basket", "state": "満", "at": [-3.9, 0.0, -0.2], "scale": 1}], "en": {"narration": "\"Look at them.\nThey've got [so many].\""}}
  - {"place": "大浜", "time": "昼", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [1.0, 1.7, 0.6], "to": [1.1, 1.65, 0.3], "look": [2.4, 1.3, -0.9], "fov": 58}, "narration": "「鮭は海から来た魚だ。\n約束どおり、[分けろ]」", "seconds": 3.0, "speaker": "イサオ", "positions": {"イサオ": [2.4, -0.9], "タケゾウ": [-2.9, -0.9]}, "faces": {"イサオ": -90, "タケゾウ": 90}, "actions": [{"do": "イサオが指さす", "from": 0.3, "to": 2.6}], "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}], "en": {"narration": "\"Salmon come from the sea.\nBy the promise, [share them].\""}}
  - {"place": "開拓前の大浜", "time": "昼", "season": "", "flashback": true, "hud": false, "cast": [], "camera": {"from": [-6.5, 1.45, 3.1], "to": [-6.5, 1.42, 2.9], "look": [-6.5, 1.12, 0.25]}, "narration": "約束は、島に来たあの日から\n「[海の魚]は分け合う」。", "seconds": 3.2, "props": [{"asset": "fish_half", "state": "頭側", "yaw": 1.57, "at": [-6.37, 1.12, 0.25]}, {"asset": "fish_half", "state": "尾側", "yaw": 1.57, "at": [-6.63, 1.12, 0.25]}], "en": {"narration": "From the start,\nthe promise had been:\n\"[Sea fish] are shared.\""}}
  - {"place": "大浜", "time": "昼", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-1.5, 1.7, 0.6], "to": [-1.6, 1.65, 0.3], "look": [-2.9, 1.3, -0.9], "fov": 58}, "narration": "「川で、自分たちの仕掛けで\n捕った魚だ」", "seconds": 3.0, "speaker": "タケゾウ", "positions": {"イサオ": [2.4, -0.9], "タケゾウ": [-2.9, -0.9]}, "faces": {"イサオ": -90, "タケゾウ": 90}, "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}], "en": {"narration": "\"We caught them in the river,\nwith a trap we built.\""}}
  - {"place": "大浜", "time": "昼", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-0.25, 3.6, 8.0], "to": [-0.25, 3.4, 7.4], "look": [-0.25, 1.0, -0.9], "fov": 82}, "narration": "河口を渡るのは掟破り。\n二人は両岸から叫び合うしかなかった。", "seconds": 3.4, "positions": {"イサオ": [2.4, -0.9], "タケゾウ": [-2.9, -0.9]}, "faces": {"イサオ": -90, "タケゾウ": 90}, "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}], "crowd": {"lines": [{"from": [3.2, -1.4], "to": [7.2, -2.4], "count": 7, "face": -90, "palette": "hama"}, {"from": [-3.7, -1.4], "to": [-7.7, -2.4], "count": 7, "face": 90, "palette": "mori"}], "seed": 6}, "en": {"narration": "Crossing the river~mouth broke the rule.\nSo the chiefs shouted from each bank."}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [2.5, 2.6, 8.5], "to": [2.0, 2.4, 8.0], "look": [0.4, 0.0, 4.2], "fov": 60}, "narration": "そこで、はま村は\n河口の前の海に[網を張った]。", "seconds": 3.2, "props": [{"asset": "tate_ami", "at": [-1.2, 0, 4.2], "scale": 1}, {"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}, {"asset": "boat", "at": [2.4, 0, 5.4], "yaw": 0.4, "scale": 1}], "en": {"narration": "So Shore Village [set a net]\nin the sea, right off the river~mouth."}}
  - {"place": "大浜", "time": "昼", "cast": ["イサオ"], "camera": {"from": [3.6, 1.6, 0.6], "to": [3.5, 1.6, 0.4], "look": [2.4, 1.3, -0.9], "fov": 58}, "narration": "鮭は海の魚だと言ったのは、はま村自身。\n海で捕るなら、文句はないはずだ。", "seconds": 3.6, "positions": {"イサオ": [2.4, -0.9]}, "faces": {"イサオ": -30}, "props": [{"asset": "tate_ami", "at": [-1.2, 0, 4.2], "scale": 1}], "en": {"narration": "Shore Village had called salmon sea fish.\nSo catching them at sea was fair."}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [-0.6, 2.0, 7.0], "to": [-0.5, 1.8, 6.4], "look": [0.2, 0.0, 4.0], "fov": 55}, "narration": "鮭は網にかかり、\nやなまで来なくなった。", "seconds": 3.2, "props": [{"asset": "tate_ami", "at": [-1.2, 0, 4.2], "scale": 1}, {"asset": "salmon", "at": [-0.4, 0.02, 4.15], "yaw": 0.0, "scale": 1.5}, {"asset": "salmon", "at": [0.6, 0.02, 4.15], "yaw": 0.2, "scale": 1.5}, {"asset": "salmon", "at": [1.3, 0.02, 4.15], "yaw": -0.2, "scale": 1.5}], "en": {"narration": "The salmon hit the net\nand stopped reaching the weir."}}
  - {"place": "大浜", "time": "夕方", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-1.5, 1.7, 0.6], "to": [-1.6, 1.65, 0.3], "look": [-2.9, 1.3, -0.9], "fov": 58}, "narration": "「海の魚なら分けろ。\n[お前たちが言ったとおりだ]」", "seconds": 3.2, "speaker": "タケゾウ", "positions": {"イサオ": [2.4, -0.9], "タケゾウ": [-2.9, -0.9]}, "faces": {"イサオ": -90, "タケゾウ": 90}, "actions": [{"do": "タケゾウが指さす", "from": 0.3, "to": 2.8}], "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}], "en": {"narration": "\"If they're sea fish, share them.\n[Your own words.]\""}}
  - {"place": "大浜", "time": "夕方", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [1.0, 1.7, 0.6], "to": [1.1, 1.65, 0.3], "look": [2.4, 1.3, -0.9], "fov": 58}, "narration": "「これは、\n[川へ向かう魚]だ」", "seconds": 2.8, "speaker": "イサオ", "positions": {"イサオ": [2.4, -0.9], "タケゾウ": [-2.9, -0.9]}, "faces": {"イサオ": -90, "タケゾウ": 90}, "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}], "en": {"narration": "\"These are fish\n[headed for the river].\""}}
  - {"place": "大浜", "time": "夕方", "cast": [], "camera": {"from": [-0.25, 7.5, 7.5], "to": [-0.25, 7.3, 7.0], "look": [-0.25, 0, 0.6], "fov": 62}, "narration": "鮭を独り占めしようとしたのは、\nもり村が先だった。", "seconds": 3.2, "props": [{"asset": "yana", "state": "半分", "at": [-2.1, 0, 0.4], "scale": 1}, {"asset": "tate_ami", "at": [-1.2, 0, 4.2], "scale": 1}], "en": {"narration": "It was Forest Village, after all,\nthat tried to keep them first."}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [-0.25, 7.5, 9.5], "to": [-0.25, 7.0, 8.8], "look": [-0.25, 0, 1.6], "fov": 62}, "narration": "どちらも、相手に取られる前に\n取ろうとした。", "seconds": 3.0, "props": [{"asset": "yana", "state": "延ばした", "at": [-2.1, 0, 0.4], "scale": 1}, {"asset": "tate_ami", "at": [-1.2, 0, 4.2], "scale": 1}, {"asset": "tate_ami", "at": [-1.0, 0, 5.0], "scale": 1}], "crowd": {"lines": [{"from": [3.2, -1.4], "to": [7.2, -2.4], "count": 7, "face": -90, "palette": "hama"}, {"from": [-3.7, -1.4], "to": [-7.7, -2.4], "count": 7, "face": 90, "palette": "mori"}], "seed": 6}, "en": {"narration": "Each side raced to take them\nbefore the other could."}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [-0.3, 1.6, 1.8], "to": [-0.4, 1.5, 1.5], "look": [-1.2, 0.3, 0.2], "fov": 55}, "narration": "もり村は杭を増やし、\nはま村は網を二重にした。", "seconds": 3.0, "props": [{"asset": "yana", "state": "延ばした", "at": [-2.1, 0, 0.4], "scale": 1}, {"asset": "tate_ami", "at": [-1.2, 0, 4.2], "scale": 1}, {"asset": "tate_ami", "at": [-1.0, 0, 5.0], "scale": 1}], "en": {"narration": "Forest Village added stakes.\nShore Village doubled its net."}}
  - {"place": "大浜", "time": "夕方", "cast": [], "camera": {"from": [-0.4, 9, 14], "to": [-0.3, 10, 6], "look": [-0.5, 0, -14]}, "narration": "その秋、川を上った鮭は、\n[1匹もいなかった]。", "seconds": 3.4, "props": [{"asset": "yana", "state": "延ばした", "at": [-2.1, 0, 0.4], "scale": 1}, {"asset": "tate_ami", "at": [-1.2, 0, 4.2], "scale": 1}, {"asset": "tate_ami", "at": [-1.0, 0, 5.0], "scale": 1}], "en": {"narration": "That autumn, not one salmon\nmade it [up the river]."}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [-0.25, 4.0, 9.0], "to": [-0.25, 3.6, 8.0], "look": [-0.25, 0.8, -1.5], "fov": 70}, "narration": "その年、両村は鮭で腹いっぱいになり、\n初めて[飢えずに]冬を越した。", "seconds": 3.8, "props": [{"asset": "rack", "state": "魚あり", "at": [-3.6, 0, -1.2], "scale": 1}, {"asset": "rack", "state": "魚あり", "at": [3.2, 0, -1.2], "scale": 1}, {"asset": "basket", "state": "満", "at": [-3.4, 0.0, -0.6], "scale": 1}, {"asset": "basket", "state": "満", "at": [-3.9, 0.0, -0.2], "scale": 1}], "crowd": {"lines": [{"from": [3.2, -1.4], "to": [7.2, -2.4], "count": 7, "face": -90, "palette": "hama"}, {"from": [-3.7, -1.4], "to": [-7.7, -2.4], "count": 7, "face": 90, "palette": "mori"}], "seed": 6}, "en": {"narration": "That year, both villages ate their fill.\nFor the first time, winter came [without hunger]."}}
  - {"place": "大浜", "time": "夕方", "cast": [], "camera": {"from": [-6, 24, 38], "to": [-6, 22, 35], "look": [0, 0, -6]}, "narration": "二つの故郷には、\n鮭の上る川がなかった。", "seconds": 3.0, "en": {"narration": "Neither home island\nhad a salmon river."}}
  - {"place": "大浜", "time": "夕方", "cast": [], "camera": {"from": [-0.4, 9, 14], "to": [-0.3, 10, 6], "look": [-0.5, 0, -14]}, "narration": "鮭がどこで生まれるのかを、\n島の誰も[知らなかった]。", "seconds": 3.6, "props": [{"asset": "yana", "state": "延ばした", "at": [-2.1, 0, 0.4], "scale": 1}], "en": {"narration": "No one on the island knew\nwhere salmon [are born]."}}
