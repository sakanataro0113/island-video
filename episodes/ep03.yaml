title: 第3話 河口の魚は海の魚か
title_en: "Episode 3: The Fish That Plugged the River"
year: 6
population: 41
scenes:
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [2.5, 1.2, 8.5], "to": [1.6, 1.0, 7.2], "look": [-0.7, 0.8, 2.4], "fov": 60}, "narration": "この魚一匹で、\n川が[「海」]になった。", "seconds": 3, "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "This one fish turned\na river into [the sea]."}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [-6, 24, 38], "to": [-3, 17, 28], "look": [0, 0, -6]}, "narration": "島に来て6年目。\n住民は41人。", "seconds": 2.8, "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "Year 6 on the island.\n41 people."}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [-0.7, 16, 17], "to": [-0.7, 13, 14], "look": [-0.7, 0, -4]}, "narration": "さけ川が境。\n東がはま村、西がもり村。", "seconds": 3, "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "labels": [{"text": "もり村", "x": 0.3, "y": 0.24}, {"text": "はま村", "x": 0.7, "y": 0.36}], "en": {"narration": "The river is the border.\nShore Village east,\nForest Village west.", "labels": [{"text": "Forest Village"}, {"text": "Shore Village"}]}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [-0.7, 4, 12], "to": [-0.7, 3, 9.5], "look": [-0.7, 0.6, 2.4]}, "narration": "ある朝、河口を\n[ふさぐほどの大魚]が打ち上がった。", "seconds": 3.2, "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "One morning, a fish big enough\nto [plug the river~mouth] washed up."}}
  - {"place": "大浜", "time": "朝", "cast": ["ハナ"], "camera": {"from": [-5.6, 1.6, 6.6], "to": [-5.3, 1.5, 5.8], "look": [-3.6, 1.0, 2.0]}, "narration": "見つけたのは、\nもり村のハナ。", "seconds": 2.6, "positions": {"ハナ": [-3.8, 1.6]}, "actions": [{"do": "ハナが喜ぶ", "from": 0.1, "to": 2.4}], "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "labels": [{"text": "ハナ", "sub": "もり村の漁師", "x": 0.5, "y": 0.5}], "en": {"narration": "It was found by Hana\nof Forest Village.", "labels": [{"text": "Hana", "sub": "Forest Village fisher"}]}}
  - {"place": "大浜", "time": "朝", "cast": ["ハナ", "ゲンタ"], "camera": {"from": [-3.0, 1.6, 5.6], "to": [-3.2, 1.5, 5.0], "look": [-3.8, 1.3, 1.6], "fov": 60}, "narration": "「川の魚よ。\n約束の外だわ」", "seconds": 2.5, "speaker": "ハナ", "positions": {"ハナ": [-3.8, 1.6], "ゲンタ": [2.4, 1.6]}, "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "\"A river fish.\nNot part of the promise.\""}}
  - {"place": "大浜", "time": "朝", "cast": ["ハナ", "ゲンタ"], "camera": {"from": [1.4, 1.6, 5.6], "to": [1.6, 1.5, 5.0], "look": [2.4, 1.3, 1.6], "fov": 60}, "narration": "「河口は海だ。\n分けてもらうぞ」", "seconds": 2.5, "speaker": "ゲンタ", "positions": {"ハナ": [-3.8, 1.6], "ゲンタ": [2.4, 1.6]}, "actions": [{"do": "ゲンタが指さす", "from": 0.2, "to": 2.3}], "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "\"The river~mouth is sea.\nYou'll share it.\""}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [1.8, 1.4, 6.4], "to": [1.2, 1.2, 5.6], "look": [-0.7, 0.8, 2.4], "fov": 60}, "narration": "約束は\n「[海の]魚は分け合う」。", "seconds": 2.8, "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "The promise said:\n\"[Sea] fish are shared.\""}}
  - {"place": "大浜", "time": "昼", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-0.7, 4.0, 14], "to": [-0.7, 3.4, 12], "look": [-0.7, 1.0, 2.0], "fov": 72}, "narration": "両村の村長が、\n裁きを開いた。", "seconds": 2.8, "caption": "裁き1日目", "positions": {"イサオ": [3.4, 1.2], "タケゾウ": [-4.8, 1.2]}, "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "crowd": {"lines": [{"from": [4.6, 0.6], "to": [9, 0.2], "count": 9, "face": -90, "palette": "hama"}, {"from": [-6, 0.6], "to": [-10.5, 0.2], "count": 9, "face": 90, "palette": "mori"}], "seed": 3}, "en": {"narration": "The two chiefs\nheld a trial.", "caption": "Trial, day 1"}}
  - {"place": "大浜", "time": "昼", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [1.9, 1.7, 5.2], "to": [2.1, 1.6, 4.6], "look": [3.4, 1.3, 1.2], "fov": 60}, "narration": "「満ち潮になめてみろ。\nしょっぱい。海だ」", "seconds": 3, "speaker": "イサオ", "caption": "裁き1日目", "positions": {"イサオ": [3.4, 1.2], "タケゾウ": [-4.8, 1.2]}, "actions": [{"do": "イサオが指さす", "from": 0.3, "to": 2.6}], "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "\"Taste it at high tide.\nSalty. It's the sea.\"", "caption": "Trial, day 1"}}
  - {"place": "大浜", "time": "夕方", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-3.3, 1.7, 5.2], "to": [-3.5, 1.6, 4.6], "look": [-4.8, 1.3, 1.2], "fov": 60}, "narration": "「引き潮になめてみろ。\n真水だ。川だ」", "seconds": 3, "speaker": "タケゾウ", "caption": "裁き1日目", "positions": {"イサオ": [3.4, 1.2], "タケゾウ": [-4.8, 1.2]}, "actions": [{"do": "タケゾウが指さす", "from": 0.3, "to": 2.6}], "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "\"Taste it at low tide.\nFresh. It's a river.\"", "caption": "Trial, day 1"}}
  - {"place": "大浜", "time": "夕方", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-0.7, 4.5, 14], "to": [-0.7, 4.0, 12.5], "look": [-0.7, 1.0, 2.0], "fov": 72}, "narration": "どちらも、\n[正しかった]。", "seconds": 2.6, "caption": "裁き1日目", "positions": {"イサオ": [3.4, 1.2], "タケゾウ": [-4.8, 1.2]}, "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "crowd": {"lines": [{"from": [4.6, 0.6], "to": [9, 0.2], "count": 9, "face": -90, "palette": "hama"}, {"from": [-6, 0.6], "to": [-10.5, 0.2], "count": 9, "face": 90, "palette": "mori"}], "seed": 3}, "en": {"narration": "Both were [right].", "caption": "Trial, day 1"}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [-0.7, 14, 12], "to": [-0.7, 12, 10], "look": [-0.7, 0, -2]}, "narration": "その間も、川は流れてくる。\n出口は、魚が[ふさいでいた]。", "seconds": 3.2, "caption": "裁き2日目", "sea": [0, 0.25], "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "Meanwhile, the river kept coming.\nIts exit was [plugged].", "caption": "Trial, day 2"}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [0, 3, 9], "to": [-0.5, 2.8, 8.5], "look": [-6, 0.5, -3]}, "narration": "水があふれ、\n両村の浜に迫った。", "seconds": 2.8, "caption": "裁き2日目", "sea": [0.25, 0.5], "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "The water spilled over,\ncreeping up on both villages.", "caption": "Trial, day 2"}}
  - {"place": "大浜", "time": "夕方", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-0.7, 4.5, 14], "to": [-0.7, 4.0, 12.5], "look": [-0.7, 1.0, 2.0], "fov": 72}, "narration": "それでも、魚には\n[誰も触れなかった]。", "seconds": 2.8, "caption": "裁き2日目", "sea": [0.5, 0.5], "positions": {"イサオ": [3.4, 1.2], "タケゾウ": [-4.8, 1.2]}, "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "crowd": {"lines": [{"from": [4.6, 0.6], "to": [9, 0.2], "count": 9, "face": -90, "palette": "hama"}, {"from": [-6, 0.6], "to": [-10.5, 0.2], "count": 9, "face": 90, "palette": "mori"}], "seed": 3}, "en": {"narration": "Still, no one\n[touched the fish].", "caption": "Trial, day 2"}}
  - {"place": "大浜", "time": "夕方", "cast": [], "camera": {"from": [1.8, 1.4, 6.4], "to": [1.4, 1.3, 6.0], "look": [-0.7, 0.8, 2.4], "fov": 60}, "narration": "動かせば、\n自分の魚だと認めることになる。", "seconds": 3, "caption": "裁き2日目", "sea": [0.5, 0.5], "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57}], "en": {"narration": "Moving it would mean\nclaiming it.", "caption": "Trial, day 2"}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [2.5, 1.2, 8.5], "to": [1.6, 1.0, 7.2], "look": [-0.7, 0.8, 2.4], "fov": 60}, "narration": "三日目。魚は[腐り]、\n水は家の戸口まで来た。", "seconds": 3.2, "caption": "裁き3日目", "sea": [0.5, 0.62], "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57, "state": "腐った"}], "en": {"narration": "Day three. The fish [rotted].\nThe water reached the doors.", "caption": "Trial, day 3"}}
  - {"place": "大浜", "time": "朝", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-3.3, 1.5, 5.2], "to": [-3.5, 1.4, 4.7], "look": [-4.8, 0.9, 1.2], "fov": 60}, "narration": "「……海の魚だ。\n分けよう」", "seconds": 3, "speaker": "タケゾウ", "caption": "裁き3日目", "sea": [0.62, 0.62], "positions": {"イサオ": [3.4, 1.2], "タケゾウ": [-4.8, 1.2]}, "actions": [{"do": "タケゾウがうなだれる", "from": 0.2, "to": 2.8}], "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57, "state": "腐った"}], "en": {"narration": "\"...It's a sea fish.\nWe'll share it.\"", "caption": "Trial, day 3"}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [-0.7, 5, 12], "to": [-0.7, 4.5, 10.5], "look": [-0.7, 0.8, 2.0], "fov": 72}, "narration": "両村総出で魚を切り分け、\n川の出口を開けた。", "seconds": 3.2, "caption": "裁き3日目", "sea": [0.62, 0.05], "props": [{"asset": "fish", "at": [-0.7, 0.5, 2.4], "scale": 7, "yaw": 1.57, "state": "腐った"}], "crowd": {"lines": [{"from": [1.9, 1.2], "to": [4.4, 0.4], "count": 8, "face": -90, "palette": "hama"}, {"from": [-3.3, 1.2], "to": [-5.8, 0.4], "count": 8, "face": 90, "palette": "mori"}], "seed": 5}, "en": {"narration": "Both villages cut it apart\nand cleared the river.", "caption": "Trial, day 3"}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [-0.7, 8.5, 7.5], "to": [-0.7, 8.0, 7.0], "look": [-0.7, 0.2, 0.8], "fov": 72}, "narration": "取り分は半分ずつ。\nどちらも[食べられなかった]。", "seconds": 3.2, "props": [{"asset": "fish_half", "state": "頭側_腐った", "at": [1.9, 0.35, 0.8], "scale": 3.4, "yaw": 1.57}, {"asset": "fish_half", "state": "尾側_腐った", "at": [-3.3, 0.35, 0.8], "scale": 3.4, "yaw": 1.57}], "en": {"narration": "Each village got half.\nNeither half [was edible]."}}
  - {"place": "大浜", "time": "夕方", "cast": [], "camera": {"from": [-0.7, 10, 14], "to": [-0.7, 12, 17], "look": [-0.7, 0, 0]}, "narration": "この日から、\n河口は「海」になった。", "seconds": 3, "en": {"narration": "From that day on,\nthe river~mouth was sea."}}
  - {"place": "大浜", "time": "夕方", "cast": ["タケゾウ"], "camera": {"from": [-6.6, 1.5, 6.0], "to": [-6.3, 1.45, 5.4], "look": [-4.8, 1.2, 1.2], "fov": 60}, "narration": "もり村は、快く\n[真実を認めた]のである。", "seconds": 3, "positions": {"タケゾウ": [-4.8, 1.2]}, "faces": {"タケゾウ": 60}, "en": {"narration": "Forest Village graciously\n[accepted the truth]."}}
  - {"place": "大浜", "time": "夕方", "cast": ["タケゾウ"], "camera": {"from": [-6.0, 1.6, 4.2], "to": [-5.8, 1.6, 3.8], "look": [-4.8, 1.5, 1.2], "fov": 50}, "narration": "タケゾウは、この三日間を\n[忘れなかった]。", "seconds": 3, "positions": {"タケゾウ": [-4.8, 1.2]}, "faces": {"タケゾウ": 60}, "en": {"narration": "Takezo never [forgot]\nthose three days."}}
