title: 第3話 河口の魚は海の魚か
title_en: "Episode 3: Is a River-Mouth Fish a Sea Fish?"
year: 6
population: 41
scenes:
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [0.9, 0.9, 4.6], "to": [0.4, 0.7, 3.7], "look": [-0.7, 0.2, 2.2], "fov": 60}, "narration": "この魚は、\n[三日間]裁かれた。", "seconds": 3, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [], "en": {"narration": "This fish was on trial\nfor [three days]."}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [-6, 24, 38], "to": [-3, 17, 28], "look": [0, 0, -6]}, "narration": "島に来て6年目。\n住民は41人。", "seconds": 3, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [], "en": {"narration": "Year 6 on the island.\n41 people."}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [-0.7, 16, 16], "to": [-0.7, 13, 13], "look": [-0.7, 0, -5]}, "narration": "川が境だ。\n東がはま村、西がもり村。", "seconds": 3, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [{"text": "もり村", "x": 0.3, "y": 0.24}, {"text": "はま村", "x": 0.7, "y": 0.36}], "en": {"narration": "The river is the border.\nShore Village east,\nForest Village west.", "labels": [{"text": "Forest Village"}, {"text": "Shore Village"}]}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [-0.7, 3, 8.5], "to": [-0.7, 2, 6], "look": [-0.7, 0.2, 2.2]}, "narration": "ある朝、河口のど真ん中に\n[大物]が打ち上がった。", "seconds": 3, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [], "en": {"narration": "One morning, a [huge fish]\nwashed up in the river~mouth."}}
  - {"place": "大浜", "time": "朝", "cast": ["ハナ"], "camera": {"from": [-3.6, 1.5, 6.2], "to": [-3.3, 1.4, 5.4], "look": [-2.4, 1.0, 1.8]}, "narration": "見つけたのは、\nもり村のハナ。", "seconds": 2.7, "positions": {"ハナ": [-2.6, 1.6]}, "faces": {"ハナ": -30}, "actions": [{"do": "ハナが喜ぶ", "from": 0.1, "to": 2.5}], "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [{"text": "ハナ", "sub": "もり村の漁師", "x": 0.5, "y": 0.5}], "en": {"narration": "It was found by Hana\nof Forest Village.", "labels": [{"text": "Hana", "sub": "Forest Village fisher"}]}}
  - {"place": "大浜", "time": "朝", "cast": ["ハナ", "ゲンタ"], "camera": {"from": [-1.8, 1.6, 5.4], "to": [-2.0, 1.5, 4.8], "look": [-2.6, 1.3, 1.6], "fov": 60}, "narration": "「川の魚よ。\n約束の外だわ」", "seconds": 2.5, "speaker": "ハナ", "positions": {"ハナ": [-2.6, 1.6], "ゲンタ": [1.4, 1.6]}, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [], "en": {"narration": "\"A river fish.\nNot part of the promise.\""}}
  - {"place": "大浜", "time": "朝", "cast": ["ハナ", "ゲンタ"], "camera": {"from": [0.4, 1.6, 5.4], "to": [0.6, 1.5, 4.8], "look": [1.4, 1.3, 1.6], "fov": 60}, "narration": "「河口は海だ。\n分けてもらうぞ」", "seconds": 2.5, "speaker": "ゲンタ", "positions": {"ハナ": [-2.6, 1.6], "ゲンタ": [1.4, 1.6]}, "actions": [{"do": "ゲンタが指さす", "from": 0.2, "to": 2.3}], "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [], "en": {"narration": "\"The river~mouth is sea.\nYou'll share it.\""}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [0.3, 1.1, 4.0], "to": [-0.1, 0.9, 3.5], "look": [-0.7, 0.2, 2.2], "fov": 60}, "narration": "約束は\n「[海の]魚は分け合う」。", "seconds": 2.8, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [], "en": {"narration": "The promise said:\n\"[Sea] fish are shared.\""}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [-0.7, 5, 8], "to": [-0.7, 8, 11], "look": [-0.7, 0, -1]}, "narration": "では、河口は\n海か、川か。", "seconds": 2.7, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [], "en": {"narration": "So, is a river~mouth\nsea or river?"}}
  - {"place": "大浜", "time": "昼", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-0.7, 3.4, 11], "to": [-0.7, 3.0, 9.5], "look": [-0.7, 0.9, 1.6], "fov": 72}, "narration": "両村の村長が、\n裁きを開いた。", "seconds": 3, "caption": "裁き1日目", "positions": {"イサオ": [2.4, 1.4], "タケゾウ": [-3.8, 1.4]}, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "crowd": {"lines": [{"from": [3.6, 0.4], "to": [8.5, 0.0], "count": 9, "face": -90, "palette": "hama"}, {"from": [-4.8, 0.4], "to": [-9.5, 0.0], "count": 9, "face": 90, "palette": "mori"}], "seed": 3}, "labels": [], "en": {"narration": "The two chiefs\nheld a trial.", "caption": "Trial, day 1"}}
  - {"place": "大浜", "time": "昼", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [0.9, 1.7, 5.0], "to": [1.1, 1.6, 4.4], "look": [2.4, 1.3, 1.4], "fov": 60}, "narration": "「満ち潮になめてみろ。\nしょっぱい。海だ」", "seconds": 3, "speaker": "イサオ", "caption": "裁き1日目", "positions": {"イサオ": [2.4, 1.4], "タケゾウ": [-3.8, 1.4]}, "actions": [{"do": "イサオが指さす", "from": 0.3, "to": 2.6}], "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [], "en": {"narration": "\"Taste it at high tide.\nSalty. It's the sea.\"", "caption": "Trial, day 1"}}
  - {"place": "大浜", "time": "夕方", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-2.3, 1.7, 5.0], "to": [-2.5, 1.6, 4.4], "look": [-3.8, 1.3, 1.4], "fov": 60}, "narration": "「引き潮になめてみろ。\n真水だ。川だ」", "seconds": 3, "speaker": "タケゾウ", "caption": "裁き2日目", "positions": {"イサオ": [2.4, 1.4], "タケゾウ": [-3.8, 1.4]}, "actions": [{"do": "タケゾウが指さす", "from": 0.3, "to": 2.6}], "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [], "en": {"narration": "\"Taste it at low tide.\nFresh. It's a river.\"", "caption": "Trial, day 2"}}
  - {"place": "大浜", "time": "夕方", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-0.7, 4.5, 12], "to": [-0.7, 4.0, 10.5], "look": [-0.7, 0.8, 1.6], "fov": 72}, "narration": "どちらも、\n[正しかった]。", "seconds": 2.7, "caption": "裁き2日目", "positions": {"イサオ": [2.4, 1.4], "タケゾウ": [-3.8, 1.4]}, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "crowd": {"lines": [{"from": [3.6, 0.4], "to": [8.5, 0.0], "count": 9, "face": -90, "palette": "hama"}, {"from": [-4.8, 0.4], "to": [-9.5, 0.0], "count": 9, "face": 90, "palette": "mori"}], "seed": 3}, "labels": [], "en": {"narration": "Both were [right].", "caption": "Trial, day 2"}}
  - {"place": "大浜", "time": "昼", "cast": [], "camera": {"from": [-0.7, 2.6, 4.6], "to": [-0.7, 2.0, 3.7], "look": [-0.7, 0.15, 2.2], "fov": 60}, "narration": "その間、魚は\n日なたに置かれていた。", "seconds": 2.8, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57}], "labels": [], "en": {"narration": "All the while,\nthe fish lay in the sun."}}
  - {"place": "大浜", "time": "朝", "cast": [], "camera": {"from": [0.9, 0.9, 4.6], "to": [0.4, 0.7, 3.7], "look": [-0.7, 0.2, 2.2], "fov": 60}, "narration": "三日目の朝、\n魚は[腐っていた]。", "seconds": 3, "caption": "裁き3日目", "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57, "state": "腐った"}], "labels": [], "en": {"narration": "On the third morning,\nthe fish had [rotted].", "caption": "Trial, day 3"}}
  - {"place": "大浜", "time": "朝", "cast": ["イサオ", "タケゾウ"], "camera": {"from": [-0.7, 3.0, 10], "to": [-0.7, 2.8, 9.0], "look": [-0.7, 0.9, 1.6], "fov": 72}, "narration": "判決は出ず、\n誰も食べられなかった。", "seconds": 3, "caption": "裁き3日目", "positions": {"イサオ": [2.4, 1.4], "タケゾウ": [-3.8, 1.4]}, "actions": [{"do": "イサオがうなだれる", "from": 0.2, "to": 2.8}, {"do": "タケゾウがうなだれる", "from": 0.2, "to": 2.8}], "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57, "state": "腐った"}], "crowd": {"lines": [{"from": [3.6, 0.4], "to": [8.5, 0.0], "count": 9, "face": -90, "palette": "hama"}, {"from": [-4.8, 0.4], "to": [-9.5, 0.0], "count": 9, "face": 90, "palette": "mori"}], "seed": 3}, "labels": [], "en": {"narration": "No verdict.\nNo one ate it.", "caption": "Trial, day 3"}}
  - {"place": "大浜", "time": "夕方", "cast": [], "camera": {"from": [-0.7, 10, 14], "to": [-0.7, 12, 17], "look": [-0.7, 0, 0]}, "narration": "それ以来、河口の魚には\n誰も手を出さない。", "seconds": 3, "labels": [], "en": {"narration": "Since that day, no one\ntouches river-mouth~fish."}}
  - {"place": "大浜", "time": "夕方", "cast": [], "camera": {"from": [4, 3, 9], "to": [3, 3, 8], "look": [-1, 1, 0]}, "narration": "歴史家の見解。\n河口は、もちろん海である。", "seconds": 3, "labels": [], "en": {"narration": "This historian's ruling:\nobviously, it was the sea."}}
  - {"place": "大浜", "time": "夜", "cast": [], "camera": {"from": [0.9, 0.9, 4.6], "to": [0.6, 0.8, 4.2], "look": [-0.7, 0.2, 2.2], "fov": 60}, "narration": "あなたの判決は?", "seconds": 3, "props": [{"asset": "fish", "at": [-0.7, 0.12, 2.2], "scale": 2.2, "yaw": 1.57, "state": "腐った"}], "labels": [{"text": "海の魚", "x": 0.28, "y": 0.3}, {"text": "川の魚", "x": 0.72, "y": 0.3}], "en": {"narration": "And your verdict?", "labels": [{"text": "Sea fish"}, {"text": "River fish"}]}}
