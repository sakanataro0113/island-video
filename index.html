<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小さな島の年代記 シミュレータ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<nav class="tabs" aria-label="画面の切り替え">
  <a id="tab-video" href="#video">映像</a>
  <a id="tab-assets" href="#assets">素材一覧</a>
</nav>
<main class="app" id="view-video">
  <section class="stage">
    <div class="frame" id="frame">
      <canvas id="gl" width="540" height="960" aria-label="3D映像のプレビュー"></canvas>
      <canvas id="overlay" width="540" height="960" aria-hidden="true"></canvas>
    </div>
    <div class="transport">
      <button id="play" type="button">再生</button>
      <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="再生位置">
      <output id="clock">0.0秒</output>
    </div>
    <div class="transport">
      <button id="export" type="button">MP4を書き出す</button>
      <button id="save" type="button" hidden>MP4を保存</button>
      <progress id="progress" max="1" value="0" hidden></progress>
    </div>
  </section>
  <section class="panel">
    <h1>小さな島の年代記 シミュレータ</h1>
    <div class="row">
      <label class="lab" for="episode">話を選ぶ <select id="episode"></select></label>
      <label class="file" for="file">台本を読み込む<input id="file" type="file" accept=".yaml,.yml,.txt"></label>
      <button id="apply" type="button">台本を反映</button>
    </div>
    <label class="lab" for="text">台本</label>
    <textarea id="text" spellcheck="false"></textarea>
    <p class="message" id="message" role="status"></p>
    <details>
      <summary>使える指定</summary>
      <dl id="vocab"></dl>
    </details>
  </section>
</main>
<main class="assets" id="view-assets" hidden>
  <div class="filters">
    <input id="asset-search" type="search" placeholder="名前、タグ、状態で検索" aria-label="素材を検索">
    <button class="chip" id="asset-used" type="button" aria-pressed="false">台本で使用中</button>
    <button class="plain" id="asset-clear" type="button">すべて解除</button>
    <output id="asset-count"></output>
    <div class="group"><span>種類</span><div id="asset-kinds"></div></div>
    <div class="group"><span>タグ</span><div id="asset-tags"></div></div>
  </div>
  <pre class="asset-errors" id="asset-errors" hidden></pre>
  <div id="asset-grid"></div>
</main>
<dialog id="asset-dialog" aria-labelledby="asset-title">
  <header><div><h2 id="asset-title"></h2><p id="asset-info"></p></div><button id="asset-close" class="plain" type="button">閉じる</button></header>
  <div class="dialog-body">
    <div class="viewer"><canvas id="asset-view" width="640" height="640" aria-label="素材の3Dプレビュー。ドラッグで回転できます"></canvas><p>ドラッグで回転</p><div id="asset-states" class="chips"></div></div>
    <div class="source"><h3>素材ファイル</h3><pre id="asset-raw"></pre></div>
  </div>
</dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
