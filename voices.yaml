# 読み上げの声
# engine を gemini か chirp に書き換えると、使う音声合成が切り替わる。
# 設定を変えると、次に再生するときに作り直す(作った音声はブラウザに保存され、同じ文と設定なら二度は作らない)。
engine: gemini

# Gemini 3.8 Flash TTS(Gemini API、有料。キーは Cloudflare の GEMINI_API_KEY)
gemini:
  model: gemini-3.8-flash-tts
  # 歴史家の語り(speaker のないカット)。声の名前(Alnilam など)か、Voice design で作った voice_… の ID
  narrator: Alnilam
  # 話し方の指示。短いほど声が安定する
  style: Narration
  # ばらつきの大きさ(0〜2)。消すとモデルの標準(1)。
  # 低すぎると無音や失敗が起きるという報告があり、Google は標準のままを勧めている。
  # 無音の音声は自動で弾くので、試しに下げてよい
  temperature: 0.5
  # セリフの声。ここに書いた人物だけセリフを読み上げる。書かない人物のセリフは字幕のみ
  characters:
    # イサオ: Orus

# Chirp 3: HD(Google Cloud TTS、毎月100万字まで無料。キーは Cloudflare の GOOGLE_TTS_KEY)
chirp:
  narrator: ja-JP-Chirp3-HD-Charon
  # 読む速さ。1.0 が標準
  rate: 1.0
  characters:
    # イサオ: ja-JP-Chirp3-HD-Orus
    # タケゾウ: ja-JP-Chirp3-HD-Fenrir
    # ゲンタ: ja-JP-Chirp3-HD-Puck
    # ハナ: ja-JP-Chirp3-HD-Kore
